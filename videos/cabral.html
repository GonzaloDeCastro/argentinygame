<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>San Lorenzo - El sargento Cabral</title>
<style>
  html,body{margin:0;height:100%;background:#000;font-family:Georgia,serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{width:min(100vw,calc((100vh - 50px)*16/9));aspect-ratio:16/9;cursor:pointer}
  #barra{height:50px;display:flex;gap:10px;align-items:center;color:#ddd}
  button{font:15px Georgia,serif;padding:6px 14px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="barra">
  <button id="play">Reproducir</button>
  <button id="reset">Desde el principio</button>
  <input id="seek" type="range" min="0" max="42" step="0.05" value="0">
  <span id="reloj">0 s</span>
</div>
<script src="voces/voces2.js"></script>
<script>
"use strict";
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 1280, H = 720, DUR = 42;
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const lerp = (a,b,k) => a + (b-a)*k;
const suave = k => { k = clamp(k); return k*k*(3-2*k); };

/* ---------- guion: cada dialogo es [inicio, fin, quien, texto] ---------- */
const DIALOGOS = [
  [ 7.0,  9.4, 'sm',     '¡No puedo moverme!'],
  [13.2, 15.8, 'cabral', '¡Aguante, mi coronel!'],
  [17.9, 20.8, 'sm',     '¡Cabral! ¡A su espalda!'],
  [23.2, 26.8, 'sm',     '¡Cabral! Me ha salvado la vida.'],
  [27.3, 32.4, 'cabral', 'Muero contento... hemos batido al enemigo.'],
  [32.9, 36.2, 'sm',     'Su nombre vivirá en cada granadero.'],
];
/* ---------- voces ---------- */
// T = segundos reales; t = tiempo de la animacion (la intro y la orden se estiran)
const TRAMOS = [[0,0],[42,42]];
function aEscena(T){
  for(let i=1;i<TRAMOS.length;i++){
    const [T0,t0] = TRAMOS[i-1], [T1,t1] = TRAMOS[i];
    if(T <= T1) return lerp(t0,t1,(T-T0)/(T1-T0));
  }
  return DUR;
}
// [segundo real, clip, quien mueve la boca, volumen]
const PISTAS = [
  [ 0.9, 'n1', null,     1],
  [ 7.0, 's1', 'sm',     1],
  [13.2, 'c1', 'cabral', 1],
  [17.9, 's2', 'sm',     1],
  [23.2, 's3', 'sm',     1],
  [27.3, 'c2', 'cabral', 1],
  [32.9, 's4', 'sm',     1],
  [36.8, 'n2', null,     1],
];
const audio = new AudioContext(), buffers = {};
let fuentes = [], T = 0;
const cargadas = Promise.all(Object.entries(window.VOCES || (typeof VOCES!=='undefined' ? VOCES : {})).map(async ([n,b64]) => {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  buffers[n] = await audio.decodeAudioData(bytes.buffer);
}));
function pararVoces(){ fuentes.forEach(f => f.stop()); fuentes = []; }
const CON_VOCES = false;   // la letra de la marcha tapa mejor sin voces habladas
function lanzarVoces(){
  pararVoces();
  if(!CON_VOCES) return;
  for(const [ini,n,,vol] of PISTAS){
    const b = buffers[n];
    if(!b || ini + b.duration <= T) continue;
    const f = audio.createBufferSource(), v = audio.createGain();
    f.buffer = b; v.gain.value = vol; f.connect(v).connect(audio.destination);
    f.start(audio.currentTime + Math.max(0, ini-T), Math.max(0, T-ini));
    fuentes.push(f);
  }
}
// apertura de la boca (0 a 1) segun el volumen del audio en este instante
function habla(t,q){
  for(const [ini,n,quien] of PISTAS){
    const b = buffers[n];
    if(quien !== q || !b || T < ini || T >= ini + b.duration) continue;
    const d = b.getChannelData(0), i = Math.floor((T-ini)*b.sampleRate);
    let suma = 0, num = 0;
    for(let j=i; j<Math.min(d.length, i+1000); j+=4){ suma += d[j]*d[j]; num++; }
    return clamp(Math.sqrt(suma/(num||1))*6);
  }
  return 0;
}

/* ---------- utilidades de dibujo ---------- */
function forma(puntos, color, borde=true){
  g.beginPath();
  puntos.forEach((p,i) => i ? g.lineTo(p[0],p[1]) : g.moveTo(p[0],p[1]));
  g.closePath(); g.fillStyle = color; g.fill();
  if(borde){ g.strokeStyle = '#1a1210'; g.lineWidth = 3; g.lineJoin = 'round'; g.stroke(); }
}
function ovalo(x,y,rx,ry,color,borde=true){
  g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fillStyle = color; g.fill();
  if(borde){ g.strokeStyle = '#1a1210'; g.lineWidth = 3; g.stroke(); }
}
function linea(puntos, color, ancho){
  g.beginPath();
  puntos.forEach((p,i) => i ? g.lineTo(p[0],p[1]) : g.moveTo(p[0],p[1]));
  g.strokeStyle = color; g.lineWidth = ancho; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke();
}

/* ---------- ayudas de arte ---------- */
const TINTA = '#1a1210';
function trazo(d, color, borde=3){
  const p = new Path2D(d);
  g.fillStyle = color; g.fill(p);
  if(borde){ g.strokeStyle = TINTA; g.lineWidth = borde; g.lineJoin = 'round'; g.stroke(p); }
  return p;
}
// pinta sombras o luces sin salirse de la figura, y repasa el contorno
function volumen(p, pintar, borde=3){
  g.save(); g.clip(p); pintar(); g.restore();
  if(borde){ g.strokeStyle = TINTA; g.lineWidth = borde; g.stroke(p); }
}
const azar = n => { const x = Math.sin(n*12.9898)*43758.5453; return x - Math.floor(x); };
function degradado(y0,y1,paradas){
  const gr = g.createLinearGradient(0,y0,0,y1);
  paradas.forEach(([k,c]) => gr.addColorStop(k,c));
  return gr;
}

/* ---------- fondo ---------- */
function cielo(t){
  const k = clamp(t/25), mez = (a,b) => `rgb(${a.map((v,i)=>lerp(v,b[i],k)|0)})`;
  g.fillStyle = degradado(0,430,[[0,mez([28,30,72],[70,120,190])],[.45,mez([110,70,120],[140,175,215])],
                                 [.75,mez([220,105,95],[250,190,150])],[1,mez([255,180,100],[255,220,150])]]);
  g.fillRect(-200,-200,W+400,H+400);
  const sx = 930, sy = lerp(420,200,k);
  const halo = g.createRadialGradient(sx,sy,40,sx,sy,360);
  halo.addColorStop(0,'rgba(255,225,150,.85)'); halo.addColorStop(1,'rgba(255,180,100,0)');
  g.fillStyle = halo; g.fillRect(-200,-200,W+400,H+400);
  for(let i=0;i<9;i++){
    const a = Math.PI + i*Math.PI/8 + Math.sin(t*.2)*.05;
    forma([[sx,sy],[sx+Math.cos(a-.05)*700,sy+Math.sin(a-.05)*700],[sx+Math.cos(a+.05)*700,sy+Math.sin(a+.05)*700]], 'rgba(255,230,170,.07)', false);
  }
  ovalo(sx,sy,55,55,'#fff0bd',false);
  for(let i=0;i<6;i++){
    const x = ((i*290 + t*(7+i*2)) % 1750) - 220, y = 60 + (i*57)%190, s = .7 + azar(i)*.6;
    const nube = (dy,color) => {
      g.beginPath();
      for(const [dx,ey,r] of [[-60,6,22],[-25,-6,34],[20,-12,40],[62,2,28],[95,10,16]]){
        g.moveTo(x+dx*s+r*s, y+(ey+dy)*s); g.arc(x+dx*s, y+(ey+dy)*s, r*s, 0, Math.PI*2);
      }
      g.fillStyle = color; g.fill();
    };
    g.save(); g.beginPath(); g.rect(-300,-200,2000,y+22*s+200); g.clip();
    nube(5,'rgba(255,190,140,.55)'); nube(-2,'rgba(150,105,145,.55)');
    g.restore();
  }
  for(let i=0;i<7;i++){
    const x = ((t*38 + i*47 + 300) % 1600) - 100, y = 150 + azar(i+3)*90 + Math.sin(t*2+i)*6;
    const a = Math.sin(t*9+i*2)*7;
    linea([[x-11,y-a],[x,y],[x+11,y-a]], '#33233a', 2.5);
  }
}
function arbol(x,y,s,color,luz){
  forma([[x-7*s,y],[x-4*s,y-45*s],[x+4*s,y-45*s],[x+9*s,y]], '#4a3322', false);
  for(const [dx,dy,r] of [[-30,-55,26],[28,-58,28],[0,-80,34],[-8,-52,30],[14,-45,24]]) ovalo(x+dx*s,y+dy*s,r*s,r*.85*s,color,false);
  for(const [dx,dy,r] of [[12,-90,18],[36,-66,14],[-18,-66,12]]) ovalo(x+dx*s,y+dy*s,r*s,r*.6*s,luz,false);
}
function barco(x,y,s,t){
  g.save(); g.translate(x, y + Math.sin(t*1.5+x)*3);
  ovalo(0,34*s,85*s,7*s,'rgba(30,30,55,.35)',false);
  g.scale(s,s); g.rotate(Math.sin(t*1.1+x)*.015);
  const casco = trazo('M-95,-8 L-62,2 L55,2 L96,-18 L70,28 Q0,38 -68,28 Z', '#5a3520', 3);
  volumen(casco, () => {
    g.fillStyle = '#3c2214'; g.fillRect(-100,16,200,30);
    linea([[-90,9],[90,9]], '#d9b46a', 4);
    for(let i=-50;i<=50;i+=20){ g.fillStyle = TINTA; g.fillRect(i-3,6,6,6); }
  });
  linea([[96,-18],[128,-40]], '#2b1a10', 4);
  for(const [mx,alt] of [[-35,125],[30,140]]){
    linea([[mx,0],[mx,-alt]], '#2b1a10', 5);
    linea([[mx,-alt],[-95,-8]], 'rgba(40,25,15,.6)', 1.5); linea([[mx,-alt],[128,-40]], 'rgba(40,25,15,.6)', 1.5);
    for(const [y0,y1,an] of [[-alt+14,-alt+55,26],[-alt+62,-alt+108,34]]){
      const vela = trazo(`M${mx-an},${y0} Q${mx},${y0+7} ${mx+an},${y0} Q${mx+an+13},${(y0+y1)/2} ${mx+an+4},${y1} Q${mx},${y1+10} ${mx-an-4},${y1} Q${mx-an+8},${(y0+y1)/2} ${mx-an},${y0} Z`, '#f3e6c8', 2.5);
      volumen(vela, () => ovalo(mx-an,(y0+y1)/2,an*.7,42,'rgba(150,100,100,.3)',false), 0);
      linea([[mx-an-6,y0-2],[mx+an+6,y0-2]], '#2b1a10', 3);
    }
    const f = Math.sin(t*6+mx)*4;
    forma([[mx,-alt],[mx+16,-alt+2+f],[mx+30,-alt+5-f],[mx+16,-alt+10+f],[mx,-alt+12]], '#c8302c', false);
  }
  g.restore();
}
function paisaje(t){
  trazo('M-200,418 Q60,375 300,404 Q520,425 760,392 Q1000,368 1200,405 Q1360,425 1480,398 L1480,445 L-200,445 Z', '#7d6a7e', 0);
  for(let i=0;i<46;i++){ const x = -180+i*37; ovalo(x, 422+azar(i)*8, 26+azar(i+9)*14, 12+azar(i+5)*10, '#4f5c48', false); }
  g.fillStyle = degradado(428,520,[[0,'#c99483'],[.3,'#7f8ba4'],[1,'#43607e']]); g.fillRect(-200,428,W+400,95);
  for(let i=0;i<22;i++){                 // reflejo del sol
    const y = 433+i*3.8, an = 16+i*4 + Math.sin(t*3+i*2)*10;
    linea([[930-an+Math.sin(t*2+i)*8,y],[930+an,y]], `rgba(255,222,150,${.7-i*.022})`, 2.5);
  }
  for(let i=0;i<55;i++){
    const x = ((i*137 + t*20) % 1500) - 100, y = 440 + (i*29)%75;
    linea([[x,y],[x+14+azar(i)*30,y]], 'rgba(230,235,255,.28)', 2);
  }
  barco(820,442,.72,t); barco(1015,458,.92,t); barco(1185,437,.55,t);
  trazo('M-200,500 Q100,484 330,496 Q560,520 760,516 Q1050,494 1480,508 L1480,530 L-200,530 Z', '#c7a56c', 0);
  trazo('M-200,512 Q100,496 330,508 Q560,532 760,528 Q1050,506 1480,520 L1480,920 L-200,920 Z',
        degradado(505,720,[[0,'#a3a24a'],[.35,'#748a37'],[1,'#3f5526']]), 0);
  trazo('M360,522 Q430,570 330,620 Q200,690 250,920 L520,920 Q420,700 480,630 Q540,565 400,521 Z', 'rgba(190,150,95,.55)', 0);
  arbol(1235,540,1.35,'#3e5a2c','#8c9a3e'); arbol(1330,525,1,'#354d28','#7d8c38'); arbol(-40,535,1.2,'#3e5a2c','#8c9a3e');
  for(let i=0;i<260;i++){
    const x = azar(i)*1700 - 200, y = 535 + Math.pow(azar(i+400),1.2)*230, s = .4 + (y-530)/150;
    const v = Math.sin(t*2 + x*.02)*3*s;
    linea([[x-5*s,y],[x-7*s+v,y-9*s]], '#4d6128', 1.8); linea([[x,y],[x+v,y-14*s]], i%3 ? '#5c722c' : '#c2bb5c', 1.8); linea([[x+5*s,y],[x+8*s+v,y-8*s]], '#4d6128', 1.8);
    if(i%17===0) ovalo(x+v,y-15*s,2.6*s,2.6*s, i%34 ? '#f6efe0' : '#f2c94c', false);
  }
}
function tejado(d, x0,x1,y0,y1){
  const p = trazo(d, '#b4503a', 3);
  volumen(p, () => {
    for(let y=y0, f=0; y<y1; y+=12, f++)
      for(let x=x0-(f%2)*9; x<x1; x+=18){ g.beginPath(); g.arc(x+9,y,9,0,Math.PI); g.strokeStyle = '#7e2f22'; g.lineWidth = 1.8; g.stroke(); }
    g.fillStyle = 'rgba(60,20,40,.25)'; g.fillRect(x0,y0,(x1-x0)*.4,y1-y0);
  });
}
function ventana(x,y,an,al){
  trazo(`M${x-4},${y+al} L${x-4},${y+14} Q${x+an/2},${y-14} ${x+an+4},${y+14} L${x+an+4},${y+al} Z`, '#c9b28a', 2.5);
  trazo(`M${x},${y+al-4} L${x},${y+16} Q${x+an/2},${y-6} ${x+an},${y+16} L${x+an},${y+al-4} Z`, '#3a2a2e', 2);
  linea([[x+an/2,y+8],[x+an/2,y+al-5]], '#8a6a48', 2); linea([[x+2,y+al*.6],[x+an-2,y+al*.6]], '#8a6a48', 2);
  g.fillStyle = '#b9a078'; g.fillRect(x-7,y+al-2,an+14,6);
}
function muro(d, x0, an){
  const p = trazo(d, '#eddfc0', 3);
  volumen(p, () => {
    g.fillStyle = 'rgba(120,80,110,.22)'; g.fillRect(x0,100,an*.28,460);
    g.fillStyle = 'rgba(255,205,130,.28)'; g.fillRect(x0+an*.78,100,an*.3,460);
    g.fillStyle = 'rgba(110,80,60,.3)'; g.fillRect(0,498,500,30);
    for(let i=0;i<14;i++){            // revoque caido con ladrillo a la vista
      const x = x0 + azar(i+x0)*an, y = 200 + azar(i+7)*300;
      for(const [dx,dy] of [[0,0],[15,0],[7,7]]){ g.fillStyle = 'rgba(165,90,60,.4)'; g.fillRect(x+dx,y+dy,13,5); }
    }
  });
}
function convento(){
  ovalo(235,522,240,12,'rgba(30,30,20,.3)',false);
  muro('M40,520 L40,330 L420,330 L420,520 Z', 40, 380);
  tejado('M22,338 L70,276 L390,276 L440,338 Z', 22,440,282,340);
  g.fillStyle = '#8f6a52'; g.fillRect(42,338,376,8);
  muro('M250,330 L250,180 L350,180 L350,330 Z', 250, 100);
  tejado('M236,188 Q270,160 300,122 Q330,160 364,188 Z', 236,364,128,190);
  g.fillStyle = '#c9b28a'; g.fillRect(244,186,112,9); g.fillRect(244,258,112,8);
  linea([[300,124],[300,90]], TINTA, 5); linea([[288,101],[312,101]], TINTA, 5);
  trazo('M278,252 L278,218 Q300,188 322,218 L322,252 Z', '#3a2a2e', 3);
  trazo('M288,238 Q289,212 300,210 Q311,212 312,238 Z', '#c8952f', 2);
  ovalo(300,242,4,4,'#6e5020',false);
  ovalo(300,298,15,15,'#c9b28a'); ovalo(300,298,9,9,'#3a2a2e',false);
  for(const x of [75,145,215,362]) ventana(x,380,32,66);
  trazo('M272,520 L272,462 Q305,420 338,462 L338,520 Z', '#c9b28a', 3);
  const puerta = trazo('M281,520 L281,466 Q305,436 329,466 L329,520 Z', '#6e4128', 2.5);
  volumen(puerta, () => { for(let x=289;x<329;x+=10) linea([[x,440],[x,520]], '#45271a', 2); });
  ovalo(299,490,3,3,'#d9b46a',false); ovalo(311,490,3,3,'#d9b46a',false);
  g.fillStyle = '#a89878'; g.fillRect(264,518,82,7);
}

/* ---------- personajes ---------- */
// pie en (x,y); mira a la derecha si dir=1
function mano(x,y,piel){
  trazo(`M${x-10},${y-9} Q${x+9},${y-14} ${x+11},${y} Q${x+12},${y+14} ${x},${y+14} Q${x-12},${y+11} ${x-10},${y-9} Z`, piel, 2.5);
  linea([[x+1,y+3],[x+3,y+12]], '#8a5636', 2); linea([[x-5,y+3],[x-4,y+11]], '#8a5636', 2);
}
function brazo(p, manga, jefe){
  linea(p, TINTA, 29); linea(p, manga, 23);
  linea([[p[0][0]+4,p[0][1]],[p[1][0]+4,p[1][1]]], 'rgba(255,190,130,.22)', 6);
  const a = p[p.length-2], b = p[p.length-1];
  const en = k => [lerp(a[0],b[0],k), lerp(a[1],b[1],k)];
  const puno = (k0,k1,color) => {       // franja de bordes rectos
    const [x0,y0] = en(k0), [x1,y1] = en(k1);
    g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1);
    g.strokeStyle = color; g.lineWidth = 24; g.lineCap = 'butt'; g.stroke();
  };
  puno(.6,.84,'#b3262b');
  if(jefe) puno(.57,.63,'#f2c94c');
}
function soldado(x,y,s,dir,t,o){
  const resp = Math.sin(t*2 + x)*2;
  const boca = o.habla * 10;
  const parpadeo = ((t + o.fase) % 3.4) < 0.12;
  const cab = !o.jefe && !o.real;   // Cabral
  const casacaC = o.real ? '#a5281d' : cab ? '#2a4f96' : '#27376f';
  const piel = o.real ? '#d9a67e' : o.jefe ? '#e9bd97' : '#a8704c', sombraPiel = o.jefe ? 'rgba(165,90,70,.35)' : 'rgba(70,30,30,.35)';
  g.save(); g.translate(x,y); g.scale(s*dir, s);
  if(!o.sinSombra) ovalo(-14,3,82,13,'rgba(20,25,10,.35)',false);
  for(const px of [-21,21]){
    g.save(); g.translate(px,-135); g.rotate(o.paso ? Math.sin(t*13 + (px>0?Math.PI:0))*.4 : 0); g.translate(-px,135);
    const pierna = trazo(`M${px-17},-135 L${px+17},-135 L${px+11},-56 L${px-12},-56 Z`, '#ece7da');
    volumen(pierna, () => { g.fillStyle = 'rgba(110,100,140,.28)'; g.fillRect(px-20,-140,17,90); });
    const bota = trazo(`M${px-15},-70 Q${px},-62 ${px+15},-72 L${px+12},-14 Q${px+33},-10 ${px+31},2 L${px-14},2 Q${px-17},-35 ${px-15},-70 Z`, '#1d181c');
    volumen(bota, () => { linea([[px+7,-60],[px+5,-18]], 'rgba(255,225,200,.45)', 4); });
    linea([[px-14,-68],[px,-61],[px+14,-70]], '#6a5a50', 3);
    g.restore();
  }
  g.translate(0,resp);
  brazo([[-34,-232],[-54,-186],[-46,-142]], '#19214a', o.jefe); mano(-46,-134,piel);
  // faldones y casaca
  trazo('M-34,-140 L-44,-86 L-18,-96 L-10,-135 Z', '#1b2450');
  const casaca = trazo('M-45,-244 Q0,-256 45,-244 Q47,-200 33,-160 L36,-122 Q0,-114 -36,-122 L-33,-160 Q-47,-200 -45,-244 Z', casacaC);
  volumen(casaca, () => {
    g.fillStyle = 'rgba(10,8,35,.35)'; g.fillRect(-60,-260,30,150);
    g.fillStyle = 'rgba(255,175,110,.22)'; g.fillRect(28,-260,25,150);
    trazo('M-20,-250 L20,-250 L9,-140 L-9,-140 Z', '#b3262b', 2);
    linea([[-32,-170],[-24,-158],[-27,-145]], '#131a3c', 2.5); linea([[31,-178],[22,-166]], '#131a3c', 2.5);
    linea([[-42,-248],[34,-140]], '#efe8d6', 10); linea([[-42,-248],[34,-140]], 'rgba(110,100,140,.3)', 3);
    if(cab){ linea([[42,-248],[-34,-140]], '#efe8d6', 10); trazo('M-10,-197 L10,-197 L10,-179 L-10,-179 Z', '#d9b04a', 2.5); }
  });
  for(let i=0;i<5;i++) for(const px of [-1,1]){

function globo(texto, x, y, puntaX, aparece, grande){
  const letras = Math.floor(aparece*28);
  g.font = `${grande?'bold 44':'34'}px Georgia, serif`;
  const ancho = g.measureText(texto).width + 60, alto = grande?92:78;
  const k = suave(aparece*7);
  g.save(); g.translate(x,y); g.scale(k,k);
  g.beginPath(); g.roundRect(-ancho/2,-alto/2,ancho,alto,28);
  g.fillStyle = '#fffaf0'; g.fill(); g.strokeStyle = '#1a1210'; g.lineWidth = 4; g.stroke();
  const p = clamp(puntaX-x, -ancho/2+40, ancho/2-40);
  forma([[p-18,alto/2-2],[p+18,alto/2-2],[puntaX-x,alto/2+38]], '#fffaf0');
  g.fillStyle = '#fffaf0'; g.fillRect(p-16,alto/2-6,32,7);
  g.fillStyle = '#1a1210'; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(texto.slice(0,letras), -ancho/2+30, 2);
  g.restore();
}
function cartel(lineas, alfa){
  g.save(); g.globalAlpha = clamp(alfa); g.textAlign = 'center'; g.textBaseline = 'middle';
  for(const [txt,y,tam,color] of lineas){
    g.font = `bold ${tam}px Georgia, serif`;
    g.lineWidth = tam/7; g.strokeStyle = '#1a1210'; g.lineJoin = 'round';
    g.strokeText(txt,W/2,y); g.fillStyle = color; g.fillText(txt,W/2,y);

  g.restore();
}

  for(const [a,b,quien,txt] of DIALOGOS){
    if(t>=a && t<b && pos[quien]){

}

function dibujar(t){
  g.clearRect(0,0,W,H);
  if(t < 6.4){                       // 1. la carga y la caida
    const cae = suave((t-4.2)/.9);
    camara(1.1 + t*.015, 640 + (t>4.7 && t<5.3 ? Math.sin(t*80)*9 : 0), lerp(390,500,suave((t-4.4)/1)), () => {
      cielo(t+14); paisaje(t*6); humo(t);
      jinete((t*210)%1700-200, 545, .7, t, 2);
      jinete((t*190+500)%1700-200, 560, .75, t, 5);
      const x = lerp(140, 650, clamp(t/4.2)) + cae*70;
      if(cae <= 0) jinete(x, 690, 1.5, t, .5, {jefe:true});
      else if(cae < 1){
        girado(x, 690, cae*.5, () => { g.translate(0,cae*30); jinete(0,0,1.5,t,.5,{sinJinete:true, quieto:true}); });
        girado(x + cae*60, 640 + cae*20, cae*1.9, () => sanMartin(0, 190*(1-cae), .8, 1, t, {sinSombra:true, ceja:6}));
      } else {
        girado(x+20, 662, -1.4, () => sanMartin(0,0,.85,1,t,{sinSombra:true, ceja:6}));
        caballoTendido(x+60, 690, 1.15);
      }
      polvo(x, 690, t, (t-4.7)/1.5, 10);
    });
    cartel([['EL SARGENTO CABRAL',150,66,'#ffe6a0']], Math.min((t-.4)/.6, (3.6-t)/.6));
  }
  else if(t < 22){                   // 2. el rescate
    const levanta = suave((t-16.2)/1.5);
    const golpe = t>=20.8;
    const cam = t<10 ? [1.45,560,520] : t<16 ? [1.08,640,430] : [1.17,712,462];
    camara(cam[0] + (t%6)*.006, cam[1] + (golpe && t<21.3 ? Math.sin(t*90)*12 : 0), cam[2], () => {
      cielo(t+10); paisaje(t); humo(t);
      jinete((t*230+900)%1900-300, 540, .6, t, 3);
      // San Martin: atrapado y despues liberado
      girado(lerp(660,430,levanta), lerp(635,690,levanta), lerp(-1.38,0,levanta), () =>
        sanMartin(0,0,1.05,1,t,{sinSombra:levanta<.9, ceja:6, brazo: t<16.2 && t>9.5 ? 'tira' : 'quieto'}));
      caballoTendido(720 + levanta*55, 668, 1.25);
      // primer realista: avanza y Baigorria lo detiene
      if(t < 16){
        const llega = suave((t-7.6)/3.4), caido = suave((t-11.6)/.7);
        girado(lerp(1350,1000,llega) + caido*90, 690 - caido*20, caido*1.5, () =>
          realista(0,0,1.05,-1,t,{paso: llega<1 && t>7.6, estocada: clamp((t-11)/.5), cerrados: caido>.5, sinSombra: caido>0}));
        polvo(1090,690,t,(t-12.1)/1.2);
      }
      if(t > 10.2 && t < 13.6) jinete(lerp(-250,860,clamp((t-10.2)/1.4)) + Math.max(0,t-11.8)*520, 705, 1.15, t, 1, {lanza:true});
      // Cabral
      if(t > 12){
        const corre = suave((t-12)/1.6), cae = suave((t-21)/.8);
        const tira = t>14.6 && t<17.8;
        const x = lerp(1400,985,corre) + (tira ? levanta*45 : 0) + cae*30;
        girado(x, 692 - cae*8, tira ? -.22 : cae*1.05, () =>
          cabral(0,0,1.05,-1,t,{paso: corre<1, brazo: tira ? 'tira' : corre<1 ? 'sable' : 'quieto', alza:.4,
                                ceja: golpe ? 6 : 3, cerrados: cae>.6, sinSombra: cae>.1}));
      }
      // segundo realista: aparece detras de Cabral
      if(t > 17.2){
        const llega = suave((t-17.2)/3.4);
        realista(lerp(1420,1135,llega) + (golpe?25:0), 700, 1.1, -1, t, {paso: llega<1, estocada: clamp((t-20.4)/.4), brazo:'fusil'});
      }
    });
    dialogo(t, {sm:[t<10?520:360, 105, t<10?440:430], cabral:[840,105,900]});
    if(golpe && t < 21.25){ g.fillStyle = `rgba(255,250,235,${1-(t-20.8)/.45})`; g.fillRect(0,0,W,H); }
  }
  else if(t < 36.4){                 // 3. la despedida
    const muere = t > 32.2;
    const k = (t-22)/14.4;
    camara(1.36 + k*.16, 570, 490 + k*10, () => {
      cielo(24 - k*6); paisaje(t*.4);
      girado(285, 780, .13, () => sanMartin(0,0,1.15,1,t,{ceja:-4, sinSombra:true, cerrados: t>32.2 && t<32.9}));
      ovalo(695,680,260,26,'rgba(20,25,10,.35)',false);
      girado(920, 655, -1.37, () => cabral(0,0,1.15,1,t,{ceja:-4, sinSombra:true, cerrados: muere, sonrie: t>30.5}));
    });
    dialogo(t, {sm:[440,110,350], cabral:[720,110,660]});
  }
  else {                             // 4. homenaje
    const k = t-36.4;
    camara(1.15 - k*.025, 640, 380, () => { cielo(8 + k*2); paisaje(t*.4); convento(); });
    g.fillStyle = 'rgba(20,10,30,.45)'; g.fillRect(0,0,W,H);
    cartel([['Sargento Juan Bautista Cabral',300,58,'#ffe6a0'],['Soldado heroico',380,40,'#fff'],['San Lorenzo, 3 de febrero de 1813',450,30,'#fff']], (k-.4)/1);
  }
  g.fillStyle = '#000'; g.fillRect(0,0,W,28); g.fillRect(0,H-28,W,28);
  let negro = clamp(1 - t/.8);
  negro = Math.max(negro, clamp(1 - Math.abs(t-6.4)/.3), clamp(1 - Math.abs(t-22.15)/.4), clamp(1 - Math.abs(t-36.4)/.5), clamp((t-41.2)/.8));
  if(negro > 0){ g.fillStyle = `rgba(0,0,0,${negro})`; g.fillRect(0,0,W,H); }
}

/* ---------- musica y efectos sintetizados ---------- */
function tono(freq, dur, vol, tipo='triangle', cuando=0){
  const o = audio.createOscillator(), v = audio.createGain(), ini = audio.currentTime + cuando;
  o.type = tipo; o.frequency.value = freq;
  v.gain.setValueAtTime(vol, ini); v.gain.exponentialRampToValueAtTime(0.001, ini+dur);
  o.connect(v).connect(audio.destination); o.start(ini); o.stop(ini+dur);
}
function sonar(antes, ahora){
  const cruza = x => antes < x && ahora >= x;
  if(cruza(4.7)){ tono(48,.8,.4,'sine'); tono(80,.4,.2,'square'); }          // caida
  if(cruza(11.6)){ tono(1500,.15,.12,'square'); tono(60,.5,.3,'sine',.12); }  // lanzazo
  if(cruza(20.8)){ tono(1800,.2,.14,'sawtooth'); tono(52,.9,.35,'sine',.1); }  // sablazo
}

/* ---------- reproductor ---------- */
const bPlay = document.getElementById('play'), seek = document.getElementById('seek'), reloj = document.getElementById('reloj');
let corriendo = false, previo = 0;
/* ---------- marcha de fondo: sigue al reproductor y baja cuando alguien habla ---------- */
const marcha = new Audio('../assets/marcha-san-lorenzo.mp3');
marcha.volume = .8;
const DESFASE = 91;   // segundo de la marcha que suena al empezar la escena
function musica(){
  if(!corriendo){ marcha.pause(); return; }
  const meta = .8 * clamp((DUR-T)/2.5);
  marcha.volume = clamp(marcha.volume + (meta - marcha.volume)*.12);
  if(Math.abs(marcha.currentTime - DESFASE - T) > .4) marcha.currentTime = DESFASE + T;
  if(marcha.paused) marcha.play().catch(() => {});
}
function mostrar(){ musica(); dibujar(aEscena(T)); seek.value = T; reloj.textContent = Math.floor(T)+' s'; bPlay.textContent = corriendo?'Pausa':'Reproducir'; }
async function alternar(){
  if(corriendo){ corriendo = false; pararVoces(); mostrar(); return; }
  await audio.resume(); await cargadas;
  if(T >= DUR) T = 0;
  corriendo = true; previo = performance.now(); lanzarVoces(); mostrar();
  requestAnimationFrame(cuadro);
}
function cuadro(ahora){
  if(!corriendo) return;
  const antes = aEscena(T);
  T = Math.min(DUR, T + Math.max(0, ahora-previo)/1000); previo = ahora;
  sonar(antes, aEscena(T));
  if(T >= DUR){ corriendo = false; if(location.search.includes('juego')) parent.postMessage('video-fin', '*'); }
  mostrar();
  if(corriendo) requestAnimationFrame(cuadro);
}
bPlay.onclick = cv.onclick = alternar;
document.getElementById('reset').onclick = () => { T = 0; if(corriendo) lanzarVoces(); mostrar(); };
seek.oninput = () => { T = +seek.value; if(corriendo) lanzarVoces(); mostrar(); };
addEventListener('keydown', e => { if(e.code==='Space'){ e.preventDefault(); alternar(); } });

// ?t=12 muestra un cuadro fijo (para revisar)
const q = new URLSearchParams(location.search);
if(q.has('t')) T = +q.get('t');
mostrar();
if(q.has('t')) cargadas.then(mostrar);
if(!q.has('t')){
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0,0,W,H);
  cartel([['▶  Tocá para ver',360,54,'#fff']],1);
}

// dentro del juego: sin controles, arranca solo y avisa al terminar
if(q.has('juego')){
  document.getElementById('barra').style.display = 'none';
  cv.style.width = 'min(100vw, calc(100vh * 16 / 9))';
  Promise.race([audio.resume().then(() => true), new Promise(r => setTimeout(() => r(false), 700))])
    .then(ok => { if(ok && audio.state === 'running' && !corriendo) alternar(); });
}
